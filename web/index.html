<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GyLiber Mobile Systems Lab</title><style>body{background:#101925;color:#e5edf7;font:16px system-ui;max-width:900px;margin:auto;padding:1.5rem}input,textarea,button,select{font:inherit;padding:.65rem;background:#202e40;color:#fff;border:1px solid #7890a9;border-radius:6px}input,textarea{width:95%;margin:.35rem 0}button{cursor:pointer}section{border:1px solid #43566e;border-radius:10px;padding:1rem;margin:1rem 0}label{display:block}a{color:#9cd8ff}:focus-visible{outline:3px solid #f4c46a}#msg{white-space:pre-wrap}</style></head><body><h1>GyLiber Mobile Systems Lab</h1><p>Evidence first. Unknown device properties remain unknown. No flashing or remote shell execution.</p><section><label>Owner access token (held only in this page's memory)<input type="password" id="token" autocomplete="off"></label><button onclick="refresh()">Load overview</button> <button onclick="downloadExport()">Export JSON</button><p id="msg" role="status" aria-live="polite"></p><pre id="overview"></pre></section><section><h2>Device identity</h2><form id="device"><label>Manufacturer<input name="manufacturer" required maxlength="100"></label><label>Exact model / variant<input name="model" required maxlength="150"></label><label>Evidence / notes<textarea name="notes" maxlength="2000"></textarea></label><button>Add device</button></form><h3>Registered devices</h3><div id="devices"></div></section><section><h2>Research entry</h2><pre id="research-list"></pre><form id="research"><label>Device ID<input name="device_id" required placeholder="UUID from device list"></label><label>Title<input name="title" required maxlength="200"></label><label>Observation and source<textarea name="body" required maxlength="10000"></textarea></label><button>Add research</button></form></section><section><h2>Experiment</h2><pre id="experiments-list"></pre><form id="experiments"><label>Device ID<input name="device_id" required></label><label>Title<input name="title" required maxlength="200"></label><label>Hypothesis<textarea name="hypothesis" required maxlength="2000"></textarea></label><button>Propose experiment</button></form><form id="status"><h3>Update experiment status</h3><label>Experiment ID<input name="id" required></label><label>Status<select name="status"><option value="proposed">Proposed</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option></select></label><button>Update status</button></form></section><section><h2>Artefact metadata (no firmware uploads)</h2><pre id="artifacts-list"></pre><form id="artifacts"><label>Device ID<input name="device_id" required></label><label>Name<input name="name" required maxlength="200"></label><label>SHA-256 (64 lowercase hex)<input name="sha256" required minlength="64" maxlength="64" pattern="[a-f0-9]{64}"></label><label>Provenance<textarea name="provenance" required maxlength="2000"></textarea></label><button>Register artefact</button></form></section><script>
let secret='';const message=t=>document.getElementById('msg').textContent=t;
async function api(path,options={}){secret=document.getElementById('token').value;let r=await fetch('/api/v1/'+path,{...options,headers:{'Authorization':'Bearer '+secret,'Content-Type':'application/json'}});let body=await r.json();if(!r.ok)throw Error(body.error||'Request failed');return body}
async function refresh(){try{const [stats,dev,research,experiments,artifacts]=await Promise.all([api('overview'),api('devices'),api('research'),api('experiments'),api('artifacts')]);for(const [key,value] of [['research',research],['experiments',experiments],['artifacts',artifacts]])document.getElementById(key+'-list').textContent=JSON.stringify(value,null,2);document.getElementById('overview').textContent=JSON.stringify(stats,null,2);let box=document.getElementById('devices');box.replaceChildren();for(let d of dev){let p=document.createElement('p');p.textContent=d.manufacturer+' / '+d.model+' — '+d.id;box.append(p)}message('Loaded persisted records')}catch(e){message(e.message)}}
for(let name of ['device','research','experiments','artifacts']){document.getElementById(name).addEventListener('submit',async e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));try{let endpoint=name==='device'?'devices':name;let out=await api(endpoint,{method:'POST',body:JSON.stringify(obj)});message('Saved: '+out.id);e.target.reset();await refresh()}catch(err){message(err.message)}})}
document.getElementById('status').addEventListener('submit',async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));try{await api('experiments/'+encodeURIComponent(v.id)+'/status',{method:'PATCH',body:JSON.stringify({status:v.status})});message('Experiment status changed');await refresh()}catch(err){message(err.message)}});
async function downloadExport(){try{let out=await api('export');let u=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='gmsl-export.json';a.click();URL.revokeObjectURL(u);message('Metadata exported; keep this file securely')}catch(e){message(e.message)}}
</script></body></html>
