name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: gmsl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab -d gmsl_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lab:test_only_password@localhost:5432/gmsl_ci
      LAB_OWNER_TOKEN: synthetic-ci-token-with-at-least-32-characters
      PORT: "3030"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Database-backed end-to-end smoke test
        shell: bash
        run: |
          set -euo pipefail
          target/release/gyliber-mobile-systems-lab > /tmp/lab.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --silent --fail http://localhost:3030/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3030/health | jq -e '.status=="ok"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3030/api/v1/overview)" = "401"
          DEVICE=$(curl --fail --silent -H "Authorization: Bearer $LAB_OWNER_TOKEN" -H "Content-Type: application/json" \
            -d '{"manufacturer":"Synthetic","model":"Demo-001","notes":"No real hardware"}' http://localhost:3030/api/v1/devices | jq -r .id)
          test -n "$DEVICE"
          curl --fail --silent -H "Authorization: Bearer $LAB_OWNER_TOKEN" -H "Content-Type: application/json" \
            -d "{\"device_id\":\"$DEVICE\",\"title\":\"Observation\",\"body\":\"Synthetic only\"}" http://localhost:3030/api/v1/research | jq -e '.id != null'
          curl --fail --silent -H "Authorization: Bearer $LAB_OWNER_TOKEN" -H "Content-Type: application/json" \
            -d "{\"device_id\":\"$DEVICE\",\"title\":\"Probe\",\"hypothesis\":\"No mutation\"}" http://localhost:3030/api/v1/experiments | jq -e '.status=="proposed"'
          curl --fail --silent -H "Authorization: Bearer $LAB_OWNER_TOKEN" -H "Content-Type: application/json" \
            -d "{\"device_id\":\"$DEVICE\",\"name\":\"Test file\",\"sha256\":\"$(printf 'a%.0s' {1..64})\",\"provenance\":\"Synthetic fixture\"}" http://localhost:3030/api/v1/artifacts | jq -e '.id != null'
          curl --fail --silent -H "Authorization: Bearer $LAB_OWNER_TOKEN" http://localhost:3030/api/v1/overview | jq -e '.devices==1 and .research==1 and .experiments==1 and .artifacts==1'
          curl --fail --silent -H "Authorization: Bearer $LAB_OWNER_TOKEN" http://localhost:3030/api/v1/export | jq -e '.schema_version==1 and (.devices|length)==1 and (.artifacts|length)==1'
